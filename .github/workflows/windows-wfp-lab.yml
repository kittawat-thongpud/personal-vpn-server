name: Windows WFP bypass lab
on:
  push:
    branches: [codex/windows-wfp-lab]
  workflow_dispatch:
    inputs:
      check:
        type: choice
        description: Isolated lab only
        options: [driver-load, process-path]
        default: driver-load
permissions:
  contents: read
jobs:
  wfp-lab:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and load the pinned reference driver
        shell: pwsh
        run: ./client/windows/lab/wfp-reference-driver.ps1 -Action Start
      - name: Verify device and unload without installing filters
        if: ${{ inputs.check == 'driver-load' }}
        shell: pwsh
        run: ./client/windows/lab/wfp-reference-driver.ps1 -Action Probe
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: ${{ inputs.check != 'driver-load' }}
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: ${{ inputs.check != 'driver-load' }}
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ inputs.check != 'driver-load' }}
        id: cores
        with:
          path: dist/windows/cores
          key: windows-native-v2-x64-${{ hashFiles('client/windows/package.ps1', 'client/windows/build-tun-core.ps1', 'client/windows/native/**') }}
      - name: Prepare the owned Wintun and VPN fixture
        if: ${{ inputs.check != 'driver-load' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./client/windows/package.ps1 -Architecture x64
          $hash = (Get-FileHash dist/windows/cores/sing-box.exe).Hash
          dotnet publish client/windows/app/PersonalVpn.csproj -c Release -r win-x64 --self-contained true -o dist/windows -p:DefineConstants=PVN_WFP_LAB "-p:SingBoxHash=$hash"
          if ($LASTEXITCODE -ne 0) { throw 'Lab app build failed.' }
          go build -trimpath -o "$env:RUNNER_TEMP/pvn-probe.exe" ./client/windows/lab/path-probe.go
          if ($LASTEXITCODE -ne 0) { throw 'Lab socket probe build failed.' }
          $report = "$env:RUNNER_TEMP/pvn-wfp-reference/wintun-install.json"
          $app = Resolve-Path dist/windows/PersonalVPN.exe
          $child = Start-Process $app -ArgumentList @('--install-adapter','--report',$report) -PassThru -Wait -WindowStyle Hidden
          if ($child.ExitCode -ne 0) { Get-Content $report; throw 'Signed Wintun adapter setup failed.' }
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ inputs.check != 'driver-load' && steps.cores.outputs.cache-hit != 'true' }}
        with:
          path: dist/windows/cores
          key: windows-native-v2-x64-${{ hashFiles('client/windows/package.ps1', 'client/windows/build-tun-core.ps1', 'client/windows/native/**') }}
      - name: Run process-path matrix
        if: ${{ inputs.check != 'driver-load' }}
        id: process-path
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP/pvn-wfp-evidence/process-matrix.json"
          $app = Resolve-Path dist/windows/PersonalVPN.exe
          $services = @(Get-Service -Name SharedAccess,icssvc,RemoteAccess -ErrorAction SilentlyContinue | Where-Object Status -eq Running)
          try {
            foreach ($service in $services) { Stop-Service -Name $service.Name -Force -ErrorAction Stop }
            $child = Start-Process $app -ArgumentList @('--local-wfp-reference-lab','--report',$report,'--probe',"$env:RUNNER_TEMP/pvn-probe.exe",'--packet-dir',"$env:RUNNER_TEMP/pvn-wfp-capture") -PassThru -WindowStyle Hidden
            if (-not $child.WaitForExit(240000)) { $child.Kill(); throw 'Process matrix timed out.' }
            if (Test-Path $report) { Get-Content $report }
            if (Test-Path "$report.progress") { Move-Item -LiteralPath "$report.progress" -Destination "$env:RUNNER_TEMP/pvn-wfp-evidence/process-matrix-observed.json" }
            if ($child.ExitCode -ne 0) { throw 'Process-path matrix did not pass.' }
          } finally {
            foreach ($service in $services | Sort-Object { if ($_.Name -eq 'SharedAccess') { 0 } else { 1 } }) { Start-Service -Name $service.Name }
          }
      - name: Match packet headers and the Windows DNS queries to the two adapters
        if: ${{ always() && !cancelled() && steps.process-path.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $capture = "$env:RUNNER_TEMP/pvn-wfp-capture"
          $report = "$env:RUNNER_TEMP/pvn-wfp-evidence/packet-evidence.json"
          if (-not (Test-Path -LiteralPath $capture/manifest.json)) { throw 'The process test did not produce packet metadata.' }
          python client/windows/lab/check-wfp-packets.py $capture $report
          $result = $LASTEXITCODE
          if (Test-Path $report) { Get-Content $report }
          if ($result -ne 0) { throw 'Packet or Windows DNS coverage did not pass.' }
      - name: Remove the runner-owned reference driver
        if: ${{ always() && !cancelled() }}
        shell: pwsh
        run: ./client/windows/lab/wfp-reference-driver.ps1 -Action Stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && !cancelled() }}
        with:
          name: windows-wfp-path
          path: ${{ runner.temp }}/pvn-wfp-evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
