name: Windows client
on:
  workflow_dispatch:
    inputs:
      client_version:
        description: Shared client version to qualify without publishing
        required: true
        type: string
  workflow_call:
    inputs:
      client_version:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: false
env:
  CLIENT_VERSION: ${{ inputs.client_version }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check shared client version
        shell: pwsh
        run: |
          if ((Get-Content client/VERSION -Raw).Trim() -ne $env:CLIENT_VERSION) { throw 'Client version mismatch' }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare qualified native cores (source build if recipe changes)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./client/windows/package.ps1 -Architecture ${{ matrix.arch }}
      - name: Publish architecture-matched Administrator application with embedded TUN hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/windows/cores/sing-box.exe).Hash
          dotnet publish client/windows/app/PersonalVpn.csproj -c Release -r win-${{ matrix.arch }} --self-contained true -o dist/windows -p:DebugType=None -p:DebugSymbols=false "-p:SingBoxHash=$hash"
          if ($LASTEXITCODE -ne 0) { throw 'Managed application build failed' }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path dist/windows/PersonalVPN.exe)).ProductVersion.Split('+')[0]
          if ($version -ne $env:CLIENT_VERSION) { throw 'Windows executable version mismatch' }
      - name: Check policy, logs and architecture-matched binary integrity
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP/self-test.json"
          $p = Start-Process (Resolve-Path dist/windows/PersonalVPN.exe) -ArgumentList @('--self-test','--report',$report) -PassThru -Wait -WindowStyle Hidden
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw 'Self-tests failed' }
      - name: Install and verify signed adapter driver without routes
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP/driver-install.json"
          $p = Start-Process (Resolve-Path dist/windows/PersonalVPN.exe) -ArgumentList @('--install-adapter','--report',$report) -PassThru -Wait -WindowStyle Hidden
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw 'Adapter driver installation failed' }
      - name: Verify native Proxy capture and restoration
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP/proxy-integration.json"
          $p = Start-Process (Resolve-Path dist/windows/PersonalVPN.exe) -ArgumentList @('--local-proxy-integration','--report',$report) -PassThru -Wait -WindowStyle Hidden
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw 'Proxy integration failed' }
      - name: Verify Home, logs, tray menu and TUN plan
        shell: pwsh
        run: |
          $output = "$env:RUNNER_TEMP/mobile-layout"
          $report = "$env:RUNNER_TEMP/layout.json"
          $p = Start-Process (Resolve-Path dist/windows/PersonalVPN.exe) -ArgumentList @('--layout-test','--output',$output,'--report',$report) -PassThru -Wait -WindowStyle Hidden
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw 'Layout / tray tests failed' }
          & ./dist/windows/cores/sing-box.exe check -c "$output/tun-plan.json"
          if ($LASTEXITCODE -ne 0) { throw 'TUN config check failed' }
          Compress-Archive "$output/*.png" "dist/PersonalVPN-ui-preview-$env:CLIENT_VERSION-${{ matrix.arch }}.zip"
      - name: Verify real TUN capture, app policy, UDP and crash cleanup on isolated runner
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP/tun-integration.json"
          $p = Start-Process (Resolve-Path dist/windows/PersonalVPN.exe) -ArgumentList @('--local-tun-integration','--report',$report) -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(420000)) { $p.Kill(); Start-Sleep -Seconds 5; throw 'TUN integration exceeded its deadline' }
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw 'TUN integration failed' }
      - name: Build Windows installer
        # Compilation is independent of UI input tests. Keep its diagnostics
        # available on failed qualifications; release still requires all gates.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:/Program Files (x86)/Inno Setup*/ISCC.exe' | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler missing' }
          & $compiler.FullName "/DArchitecture=${{ matrix.arch }}" "/DAppVersion=$env:CLIENT_VERSION" "/DPackageDir=$((Resolve-Path dist/windows).Path)" client/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Test versioned migration, in-place reinstall, settings and shell shortcuts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./client/windows/tools/test-upgrade.ps1 -Architecture ${{ matrix.arch }} -Version $env:CLIENT_VERSION
      - name: Package architecture-matched ZIP and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/windows/* -DestinationPath "dist/PersonalVPN-windows-${{ matrix.arch }}-$env:CLIENT_VERSION.zip" -CompressionLevel Optimal
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -like 'PersonalVPN-*' }
          $lines = foreach ($asset in $assets) { ((Get-FileHash $asset.FullName).Hash.ToLowerInvariant() + '  ' + $asset.Name) }
          $lines | Set-Content "dist/SHA256SUMS-${{ matrix.arch }}.txt" -Encoding ascii
      - name: Stage qualified installers for the shared publisher
        shell: pwsh
        run: |
          $stage = 'client-distribution/windows-${{ matrix.arch }}'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist/PersonalVPN-*.exe,dist/PersonalVPN-*.zip,dist/SHA256SUMS-*.txt $stage
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: client-distribution/windows-${{ matrix.arch }}
          key: client-dist-${{ github.run_id }}-${{ github.sha }}-windows-${{ matrix.arch }}
          enableCrossOsArchive: true
