name: Verify and publish VPN images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install control-plane and build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test credentials and release packaging
        run: sudo "$pythonLocation/bin/python" -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test native Linux protocols
        run: sudo "$pythonLocation/bin/python" tests/integration.py --download
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Xray for container test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: xray
          platforms: linux/amd64
          load: true
          tags: personal-vpn/xray:26.10.31
          cache-from: type=gha,scope=xray
          cache-to: type=gha,scope=xray,mode=max
      - name: Build Hysteria for container test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: hysteria
          platforms: linux/amd64
          load: true
          tags: personal-vpn/hysteria:2.13.0
          cache-from: type=gha,scope=hysteria
          cache-to: type=gha,scope=hysteria,mode=max
      - name: Test scratch container startup and volume permissions
        run: sudo "$pythonLocation/bin/python" scripts/container_smoke.py

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version and prevent overwriting a release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="v$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GH_REPO,,}" >> "$GITHUB_OUTPUT"
          if gh release view "$version" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $version already exists; bump VERSION to publish another."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.release.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        if: steps.release.outputs.publish == 'true'
        run: python -m pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.release.outputs.publish == 'true'
      - name: Authenticate to private GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Xray
        id: xray
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: xray
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.prefix }}/xray:${{ steps.release.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=xray
          cache-to: type=gha,scope=xray,mode=max
      - name: Publish Hysteria
        id: hysteria
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: hysteria
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.prefix }}/hysteria:${{ steps.release.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=hysteria
          cache-to: type=gha,scope=hysteria,mode=max
      - name: Export amd64 images and deployment bundles
        if: steps.release.outputs.publish == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          PREFIX: ${{ steps.release.outputs.prefix }}
          VERSION: ${{ steps.release.outputs.version }}
          XRAY_DIGEST: ${{ steps.xray.outputs.digest }}
          HYSTERIA_DIGEST: ${{ steps.hysteria.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker pull --platform linux/amd64 "$PREFIX/xray@$XRAY_DIGEST"
          docker pull --platform linux/amd64 "$PREFIX/hysteria@$HYSTERIA_DIGEST"
          docker tag "$PREFIX/xray@$XRAY_DIGEST" "personal-vpn/xray:$VERSION-amd64"
          docker tag "$PREFIX/hysteria@$HYSTERIA_DIGEST" "personal-vpn/hysteria:$VERSION-amd64"
          docker save "personal-vpn/xray:$VERSION-amd64" "personal-vpn/hysteria:$VERSION-amd64" | gzip -n > "dist/images-linux-amd64-$VERSION.tar.gz"
          python scripts/release_bundle.py --repository "$REPOSITORY" --version "$VERSION" --xray-digest "$XRAY_DIGEST" --hysteria-digest "$HYSTERIA_DIGEST"
      - name: Publish complete private GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Source commit: %s\n\n' "$SOURCE_SHA" > dist/notes.md
          printf 'Includes deployment bundle, Linux amd64 Docker image archive and SHA256SUMS. No server credentials. See DEPLOY.md in the bundle. GHCR images also support arm64.\n' >> dist/notes.md
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS --repo "$GH_REPO" --target "$SOURCE_SHA" --title "Personal VPN $VERSION" --notes-file dist/notes.md --draft
          gh release edit "$VERSION" --repo "$GH_REPO" --draft=false
