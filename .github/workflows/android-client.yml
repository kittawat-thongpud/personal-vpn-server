name: Android client
on:
  push:
    branches: [main]
    paths:
      - 'client/android/app/**'
      - 'client/android/probe/**'
      - 'client/android/native/**'
      - 'client/android/test-fixture/**'
      - 'client/android/*.sh'
      - 'client/android/*.gradle.kts'
      - 'client/android/gradle.properties'
      - 'client/android/SIGNING-CERTIFICATE.txt'
      - '.github/workflows/android-client.yml'
  workflow_dispatch:
    inputs:
      native_only:
        description: Build the native library without publishing an APK
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: false
env:
  CLIENT_VERSION: '0.1.0'
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: client/android/app/libs/
          key: android-aar-v1-${{ hashFiles('client/android/native/**', 'client/android/test-fixture/**', 'client/android/build-native.sh') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: android-go-${{ runner.os }}-${{ hashFiles('client/android/native/**', 'client/android/build-native.sh') }}
          restore-keys: android-go-${{ runner.os }}-
      - name: Install pinned NDK
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.0.13004108'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Build and test pinned Android native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash client/android/build-native.sh
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: android-go-${{ runner.os }}-${{ hashFiles('client/android/native/**', 'client/android/build-native.sh') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-native
          path: client/android/app/libs/
          retention-days: 7
  app:
    if: ${{ !inputs.native_only }}
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-native
          path: client/android/app/libs
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Restore private signing identity
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY"
          umask 077
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/android-signing.p12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.gradle/caches
          key: android-gradle-v1-${{ hashFiles('client/android/*.gradle.kts', 'client/android/app/build.gradle.kts', 'client/android/probe/build.gradle.kts', 'client/android/gradle.properties') }}
          restore-keys: android-gradle-v1-
      - name: Build, test and sign Android APK
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/android-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          alias=$(keytool -J-Duser.language=en -J-Duser.country=US -list -keystore "$ANDROID_KEYSTORE" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD | sed -n 's/^\([^,]*\), .*PrivateKeyEntry.*$/\1/p' | head -n 1)
          test -n "$alias"
          if [ "$alias" != personal-vpn ]; then
            keytool -changealias -keystore "$ANDROID_KEYSTORE" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$alias" -destalias personal-vpn
          fi
          keytool -list -keystore "$ANDROID_KEYSTORE" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias personal-vpn
          bash client/android/build-app.sh
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: ~/.gradle/caches
          key: android-gradle-v1-${{ hashFiles('client/android/*.gradle.kts', 'client/android/app/build.gradle.kts', 'client/android/probe/build.gradle.kts', 'client/android/gradle.properties') }}
      - name: Verify release signature and ABI
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs client/android/app/build/outputs/apk/release/app-release.apk > client/android/app/build/signature.txt
          expected=$(sed -n 's/^SHA-256: //p' client/android/SIGNING-CERTIFICATE.txt | tr -d '\r')
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' client/android/app/build/signature.txt | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$expected"
          unzip -l client/android/app/build/outputs/apk/release/app-release.apk | grep -E 'lib/(arm64-v8a|x86_64)/libpvn.so'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-app
          path: |
            client/android/app/build/outputs/apk/
            client/android/app/build/reports/
            client/android/app/build/signature.txt
            client/android/probe/build/outputs/apk/debug/
          retention-days: 7
  emulator:
    if: ${{ !inputs.native_only }}
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-native
          path: client/android/app/libs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-app
          path: android-artifact
      - name: Restore test APK paths
        run: |
          mkdir -p client/android/app/build client/android/probe/build
          cp -r android-artifact/app/build/* client/android/app/build/
          cp -r android-artifact/probe/build/* client/android/probe/build/
      - name: Verify real Android 14 capture and application policy
        run: bash client/android/test-emulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-emulator-results
          path: |
            client/android/app/build/emulator/
            ${{ runner.temp }}/fixture.log
            ${{ runner.temp }}/emulator.log
          retention-days: 7
  release:
    needs: [app, emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-app
          path: android-artifact
      - name: Publish signed APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          cp android-artifact/app/build/outputs/apk/release/app-release.apk "release/PersonalVPN-Android-${CLIENT_VERSION}.apk"
          cp android-artifact/app/build/signature.txt release/SIGNATURE.txt
          cp client/android/README.md release/INSTALL.md
          cd release
          sha256sum ./* > SHA256SUMS.txt
          gh release create "android-v${CLIENT_VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Personal VPN Android ${CLIENT_VERSION}" --notes-file ../client/android/RELEASE-NOTES.md ./*
