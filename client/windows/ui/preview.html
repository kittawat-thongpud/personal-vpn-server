<div id="personal-vpn-ui-preview">
  <div class="viz-carousel viz-dotted-background" aria-label="Windows VPN client layouts">
    <section data-variant="Compact" aria-label="Compact VPN client"><div class="pv-stage" data-layout="compact"></div></section>
    <section data-variant="Workspace" aria-label="VPN client with routing workspace" hidden><div class="pv-stage" data-layout="workspace"></div></section>
  </div>
</div>
<style>
#personal-vpn-ui-preview{font-family:'Segoe UI',Tahoma,sans-serif;font-size:14px;line-height:1.5;color-scheme:light dark}
#personal-vpn-ui-preview *{box-sizing:border-box}
#personal-vpn-ui-preview [hidden]{display:none!important}
#personal-vpn-ui-preview .pv-stage{min-height:900px;padding:12px 0 28px}
#personal-vpn-ui-preview .pv-window{--pv-bg:light-dark(#eef2f9,#0d1627);--pv-panel:light-dark(#fff,#172132);--pv-inset:light-dark(#e9eef6,#101a2b);--pv-line:light-dark(#d9e1ed,#2b3547);--pv-text:light-dark(#15223a,#edf2fc);--pv-muted:light-dark(#52617a,#a1afc5);--pv-blue:light-dark(#1562cd,#368cff);--pv-green:light-dark(#087e66,#13c89b);--pv-amber:light-dark(#8c5905,#f4bf62);--pv-red:light-dark(#b3263b,#ff7f91);--pv-on-blue:#fff;--pv-gap:16px;max-width:480px;margin:0 auto;background:var(--pv-bg);color:var(--pv-text);border:1px solid var(--pv-line);border-radius:22px;overflow:hidden;box-shadow:0 14px 38px light-dark(#1c2a4112,#00000030)}
#personal-vpn-ui-preview button,#personal-vpn-ui-preview input,#personal-vpn-ui-preview select,#personal-vpn-ui-preview textarea{font:inherit;line-height:inherit}
#personal-vpn-ui-preview button{color:inherit}
#personal-vpn-ui-preview button:disabled{opacity:.45;cursor:not-allowed}
#personal-vpn-ui-preview button:focus-visible,#personal-vpn-ui-preview input:focus-visible,#personal-vpn-ui-preview select:focus-visible,#personal-vpn-ui-preview summary:focus-visible{outline:2px solid var(--pv-blue);outline-offset:3px}
#personal-vpn-ui-preview .pv-titlebar{display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid var(--pv-line)}
#personal-vpn-ui-preview .pv-mark{width:30px;height:30px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;background:var(--pv-blue);color:var(--pv-on-blue);font-size:12px;font-weight:600}
#personal-vpn-ui-preview .pv-title{font-weight:600;letter-spacing:.2px}
#personal-vpn-ui-preview .pv-eyebrow{font-size:10px;letter-spacing:1.4px;color:var(--pv-muted)}
#personal-vpn-ui-preview .pv-preview{margin-left:auto;color:var(--pv-amber);font-size:11px;text-align:right;max-width:130px}
#personal-vpn-ui-preview .pv-content{padding:20px;display:grid;gap:var(--pv-gap)}
#personal-vpn-ui-preview .pv-home{display:grid;gap:var(--pv-gap)}
#personal-vpn-ui-preview .pv-server{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:15px;background:var(--pv-panel);border:1px solid var(--pv-line);border-radius:16px}
#personal-vpn-ui-preview .pv-server-copy{flex:1;min-width:0;overflow-wrap:anywhere}
#personal-vpn-ui-preview .pv-server strong{font-size:16px;font-weight:600;display:block;overflow-wrap:anywhere}
#personal-vpn-ui-preview .pv-country{height:44px;width:44px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:light-dark(#fff,#eaf0fa);border:2px solid light-dark(#dce3ef,#c7d0df);overflow:hidden}
#personal-vpn-ui-preview .pv-country img{width:29px;height:22px;object-fit:contain;display:block}
#personal-vpn-ui-preview .pv-country-small{height:34px;width:34px}
#personal-vpn-ui-preview .pv-country-small img{width:23px;height:18px}
#personal-vpn-ui-preview .pv-small{font-size:12px;color:var(--pv-muted)}
#personal-vpn-ui-preview .pv-tiny{font-size:11px;color:var(--pv-muted)}
#personal-vpn-ui-preview .pv-tag{white-space:nowrap;font-size:10px;letter-spacing:.6px;padding:4px 7px;border:1px solid var(--pv-line);border-radius:6px;color:var(--pv-muted)}
#personal-vpn-ui-preview .pv-server svg{height:20px;width:20px;color:var(--pv-blue);flex-shrink:0}
#personal-vpn-ui-preview .pv-modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#personal-vpn-ui-preview .pv-card{padding:15px;background:var(--pv-panel);border:1px solid var(--pv-line);border-radius:16px;min-width:0}
#personal-vpn-ui-preview .pv-label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;margin-bottom:10px;color:var(--pv-text)}
#personal-vpn-ui-preview .pv-label svg{width:16px;height:16px;color:var(--pv-muted)}
#personal-vpn-ui-preview .pv-segment{display:flex;padding:4px;gap:3px;background:var(--pv-inset);border-radius:10px}
#personal-vpn-ui-preview .pv-segment button{border:0;background:transparent;padding:8px 4px;flex:1;border-radius:8px;font-size:12px;color:var(--pv-muted);white-space:nowrap;min-height:34px}
#personal-vpn-ui-preview .pv-segment button[aria-pressed=true]{background:var(--pv-blue);color:var(--pv-on-blue);font-weight:600}
#personal-vpn-ui-preview .pv-mode-detail{font-size:11px;color:var(--pv-muted);margin-top:8px;min-height:34px}
#personal-vpn-ui-preview .pv-field{display:grid;gap:6px;font-size:12px;color:var(--pv-muted);min-width:0}
#personal-vpn-ui-preview select,#personal-vpn-ui-preview input:not([type=radio]),#personal-vpn-ui-preview textarea{color:var(--pv-text);background:var(--pv-inset);border:1px solid var(--pv-line);border-radius:9px;padding:9px 10px;width:100%;min-width:0;min-height:39px}
#personal-vpn-ui-preview select option{background:var(--pv-panel);color:var(--pv-text)}
#personal-vpn-ui-preview .pv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#personal-vpn-ui-preview details{font-size:12px;color:var(--pv-muted)}
#personal-vpn-ui-preview summary{color:var(--pv-text);margin-top:10px}
#personal-vpn-ui-preview .pv-facts{padding-top:8px;display:grid;gap:7px}
#personal-vpn-ui-preview .pv-note{padding:11px 12px;border-left:3px solid var(--pv-amber);background:color-mix(in srgb,var(--pv-amber) 8%,var(--pv-inset));border-radius:0 8px 8px 0;font-size:12px;color:var(--pv-text)}
#personal-vpn-ui-preview .pv-power-area{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:13px;width:100%;padding:30px 0 20px}
#personal-vpn-ui-preview .pv-power{height:146px;width:146px;flex-shrink:0;border-radius:50%;border:9px solid color-mix(in srgb,var(--pv-green) 17%,var(--pv-bg));background:var(--pv-green);color:#042d25;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 0 0 8px color-mix(in srgb,var(--pv-green) 7%,var(--pv-bg));transition:background .2s}
#personal-vpn-ui-preview .pv-power-label{display:block;font-size:18px;line-height:1.5;text-align:center}
#personal-vpn-ui-preview .pv-back-glyph{font-size:23px;line-height:1}
#personal-vpn-ui-preview .pv-chevron{font-size:25px;line-height:1;color:var(--pv-blue)}
#personal-vpn-ui-preview .pv-power[aria-busy=true]{background:var(--pv-amber);border-color:color-mix(in srgb,var(--pv-amber) 17%,var(--pv-bg))}
#personal-vpn-ui-preview .pv-status{font-size:22px;font-weight:500;color:var(--pv-text)}
#personal-vpn-ui-preview .pv-status-reason{font-size:12px;color:var(--pv-muted);max-width:340px;min-height:36px;padding:0 6px}
#personal-vpn-ui-preview .pv-active{font-size:11px;color:var(--pv-muted);max-width:100%;overflow-wrap:anywhere;padding:0 8px}
#personal-vpn-ui-preview .pv-button{border:1px solid var(--pv-line);background:var(--pv-inset);border-radius:8px;padding:8px 11px;font-size:12px;min-height:36px}
#personal-vpn-ui-preview .pv-primary{background:var(--pv-blue);border-color:var(--pv-blue);color:var(--pv-on-blue)}
#personal-vpn-ui-preview .pv-danger{color:var(--pv-red);border-color:color-mix(in srgb,var(--pv-red) 45%,var(--pv-line))}
#personal-vpn-ui-preview .pv-link-row{display:flex;gap:9px;align-items:center;justify-content:center;text-align:center;width:100%;padding:12px;background:var(--pv-inset);border:1px solid var(--pv-line);border-radius:12px;font-size:12px}
#personal-vpn-ui-preview .pv-link-row svg{height:16px;width:16px;color:var(--pv-blue);flex-shrink:0}
#personal-vpn-ui-preview .pv-protection{display:flex;align-items:start;gap:8px;padding:12px;background:var(--pv-inset);border-radius:10px;font-size:11px;color:var(--pv-muted)}
#personal-vpn-ui-preview .pv-protection svg{width:16px;height:16px;flex-shrink:0;color:var(--pv-green);margin-top:2px}
#personal-vpn-ui-preview .pv-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:0 20px 16px;padding:5px;background:var(--pv-panel);border:1px solid var(--pv-line);border-radius:13px}
#personal-vpn-ui-preview .pv-tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:49px;background:transparent;border:0;border-radius:9px;font-size:11px;color:var(--pv-muted);padding:4px}
#personal-vpn-ui-preview .pv-tabs button svg{height:16px;width:16px}

#personal-vpn-ui-preview .pv-heading{font-size:19px;font-weight:500;margin:0}
#personal-vpn-ui-preview .pv-page-head{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;gap:9px;align-items:center;text-align:center}
#personal-vpn-ui-preview .pv-icon-button{display:grid;place-items:center;min-width:34px;min-height:34px;border:1px solid var(--pv-line);border-radius:9px;background:var(--pv-inset);padding:5px}
#personal-vpn-ui-preview .pv-icon-button svg{height:17px;width:17px}
#personal-vpn-ui-preview .pv-profile-list{display:grid;gap:11px;margin-top:15px}
#personal-vpn-ui-preview .pv-profile{border:1px solid var(--pv-line);border-radius:14px;background:var(--pv-panel);padding:12px}

#personal-vpn-ui-preview .pv-profile-name{font-size:14px;font-weight:500;overflow-wrap:anywhere}
#personal-vpn-ui-preview .pv-profile-host{font:11px Consolas,monospace;color:var(--pv-muted);overflow-wrap:anywhere}
#personal-vpn-ui-preview .pv-profile-select input{height:18px;width:18px;accent-color:var(--pv-blue);margin:0}

#personal-vpn-ui-preview .pv-profile-confirm{margin-top:10px;padding-top:10px;border-top:1px solid var(--pv-line);font-size:12px;color:var(--pv-text)}
#personal-vpn-ui-preview .pv-form{display:grid;gap:10px;margin-top:13px}

#personal-vpn-ui-preview .pv-country-field{display:flex;gap:10px;align-items:center}
#personal-vpn-ui-preview .pv-country-field select{flex:1}
#personal-vpn-ui-preview .pv-error{font-size:12px;color:var(--pv-red);min-height:0;overflow-wrap:anywhere}
#personal-vpn-ui-preview .pv-error:empty{display:none}
#personal-vpn-ui-preview .pv-empty{padding:24px 14px;border:1px dashed var(--pv-line);border-radius:12px;text-align:center;color:var(--pv-muted);font-size:12px}
#personal-vpn-ui-preview .pv-category{padding:15px;background:var(--pv-panel);border:1px solid var(--pv-line);border-radius:16px;min-width:0;margin-top:13px}

#personal-vpn-ui-preview .pv-count{margin-left:auto;font-size:11px;color:var(--pv-muted)}

#personal-vpn-ui-preview .pv-rule-list{display:grid;gap:7px;margin:11px 0}
#personal-vpn-ui-preview .pv-rule{background:var(--pv-inset);border-radius:9px;padding:9px;display:grid;grid-template-columns:minmax(0,1fr) 29px;gap:8px;align-items:center}
#personal-vpn-ui-preview .pv-rule-target{font:11px Consolas,monospace;overflow-wrap:anywhere;color:var(--pv-text)}
#personal-vpn-ui-preview .pv-rule-remove{min-height:29px;min-width:29px;background:transparent;border:1px solid var(--pv-line);border-radius:6px;padding:1px}

#personal-vpn-ui-preview .pv-verdict{padding:12px;margin-top:10px;border-radius:9px;background:var(--pv-inset);font-size:12px;overflow-wrap:anywhere;border-left:3px solid var(--pv-blue)}
#personal-vpn-ui-preview .pv-log-list{display:block;margin:12px 0;max-height:min(380px,42svh,calc(100svh - 410px));min-height:80px;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding-right:7px}
#personal-vpn-ui-preview .pv-log-actions{display:flex;gap:7px;flex-wrap:wrap}
#personal-vpn-ui-preview .pv-log{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--pv-line);font-size:11px;overflow-wrap:anywhere}
#personal-vpn-ui-preview .pv-log time{color:var(--pv-muted);font-family:Consolas,monospace}
#personal-vpn-ui-preview .pv-log b{display:block;font-size:11px;font-weight:500;color:var(--pv-blue)}
#personal-vpn-ui-preview .pv-workspace-only{display:none}
#personal-vpn-ui-preview .pv-footnote{font-size:11px;color:var(--pv-muted);padding:0 20px 15px;text-align:center}
#personal-vpn-ui-preview .pv-stack{display:grid;gap:14px}
#personal-vpn-ui-preview .pv-margin-top{margin-top:14px}
#personal-vpn-ui-preview [data-layout=workspace] .pv-window{max-width:980px}
#personal-vpn-ui-preview [data-layout=workspace] .pv-app-body{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr)}
#personal-vpn-ui-preview [data-layout=workspace] .pv-content{align-content:start}
#personal-vpn-ui-preview [data-layout=workspace] .pv-workspace-only{display:block;border-left:1px solid var(--pv-line);padding:20px}
#personal-vpn-ui-preview [data-layout=workspace] .pv-window:not([data-current-page=home]) .pv-app-body{display:block}
#personal-vpn-ui-preview [data-layout=workspace] .pv-window:not([data-current-page=home]) .pv-content{max-width:680px;margin:0 auto}
#personal-vpn-ui-preview [data-layout=workspace] .pv-window:not([data-current-page=home]) .pv-workspace-only{display:none}

@media(max-width:390px){#personal-vpn-ui-preview .pv-content{padding:14px}#personal-vpn-ui-preview .pv-modes{gap:8px}#personal-vpn-ui-preview .pv-card{padding:11px}#personal-vpn-ui-preview .pv-titlebar{padding:14px}#personal-vpn-ui-preview .pv-server{padding:11px;gap:9px}#personal-vpn-ui-preview .pv-server strong{font-size:14px}#personal-vpn-ui-preview .pv-server .pv-tag{display:none}#personal-vpn-ui-preview .pv-form-grid{grid-template-columns:1fr}#personal-vpn-ui-preview .pv-preview{max-width:106px}#personal-vpn-ui-preview .pv-tabs{margin-left:14px;margin-right:14px}#personal-vpn-ui-preview .pv-add-rule{grid-template-columns:1fr}#personal-vpn-ui-preview .pv-power{width:138px;height:138px}}
@media(pointer:coarse){#personal-vpn-ui-preview .pv-rule-remove,#personal-vpn-ui-preview .pv-icon-button{min-width:40px;min-height:40px}#personal-vpn-ui-preview .pv-rule{grid-template-columns:minmax(0,1fr) 40px}}
@media(prefers-reduced-motion:reduce){#personal-vpn-ui-preview *{transition:none!important}}

<script>
(() => {
  const root=document.getElementById('personal-vpn-ui-preview');

  const protocolInfo={
    reality:{name:'VLESS + REALITY + Vision',short:'REALITY',wire:'TCP 443',brief:'ตัวหลัก · ต้องเลือก TLS target ที่เข้ากันได้',facts:['ใช้ TCP; packet loss สูงอาจทำให้ throughput ลดลง','เปลี่ยน IP แล้ว connection เดิมอาจขาด ต้องเชื่อมต่อใหม่','REALITY เป็น camouflage และไม่ได้รับประกันว่าจะไม่ถูกบล็อก']},
    hy2:{name:'Hysteria 2',short:'Hysteria 2',wire:'UDP 443',brief:'ทางเลือก · ต้องใช้งาน UDP ได้และตรวจ certificate',facts:['UDP อาจถูกจำกัดหรือบล็อก จึงอาจเชื่อมต่อไม่ได้','ความเร็วขึ้นกับเส้นทาง ไม่มีตัวเลขความเร็วรับประกัน','ต้องตรวจ certificate/pin; recovery หลังเปลี่ยนเน็ตยังต้องทดสอบจริง']},
    auto:{name:'Auto · REALITY → Hysteria 2',short:'Auto',wire:'TCP / UDP 443',brief:'นโยบาย recovery ระหว่างสอง protocol',facts:['ไม่ใช่ protocol ใหม่; สลับเมื่อ health check ล้มเหลวต่อเนื่อง','มี cooldown และตรวจ authentication ใหม่; session เดิมอาจขาด','ใช้ IP ของ VPS เดียวกัน จึงไม่ช่วยเมื่อ IP ถูกบล็อกทั้งสองทาง']}
  };
  const categories={app:{title:'Apps',subtitle:'แอปและ executable',icon:'app-window',placeholder:'C:\\Program Files\\App\\app.exe'},domain:{title:'Websites',subtitle:'โดเมนและ subdomain',icon:'globe',placeholder:'*.example.com'},ip:{title:'IP / Networks',subtitle:'IP และ CIDR',icon:'network',placeholder:'203.0.113.0/24'}};
  const sampleProfiles=()=>[{id:'tokyo-main',name:'Tokyo · Personal VPS',country:'JP',host:'tokyo.example.net',port:443,protocol:'reality'},{id:'singapore-backup',name:'Singapore · Backup',country:'SG',host:'sg.example.net',port:443,protocol:'hy2'}];

  function appMarkup(id){return `<div class="pv-window" aria-label="Personal VPN client">
    <header class="pv-titlebar"><div class="pv-mark">PV</div><div><div class="pv-title">Personal VPN</div><div class="pv-eyebrow">WINDOWS CLIENT</div></div><div class="pv-preview">UI PREVIEW<br>ไม่มีการเชื่อมต่อจริง</div></header>
    <div class="pv-app-body"><div class="pv-content"><div class="pv-note" data-ui-notice role="alert" hidden></div>
      <div class="pv-home" data-page="home">
        <button type="button" class="pv-server" data-open-profiles aria-label="Choose server profile"><span data-server-flag></span><span class="pv-server-copy"><span class="pv-small">Change server</span><strong data-server-name></strong><span class="pv-tiny" data-server-location></span></span><span class="pv-tag" data-profile-count></span><span class="pv-chevron" aria-hidden="true">›</span></button>
        <div class="pv-modes"><div class="pv-card"><div class="pv-label">${icon('waypoints')}Capture mode</div><div class="pv-segment" role="group" aria-label="Capture mode"><button type="button" data-capture="proxy" aria-pressed="true">Proxy</button><button type="button" data-capture="tun" aria-pressed="false">TUN</button></div><div class="pv-mode-detail" data-capture-note></div></div><div class="pv-card"><div class="pv-label">${icon('sliders-horizontal')}Traffic mode</div><div class="pv-segment" role="group" aria-label="Traffic mode"><button type="button" data-traffic="rules" aria-pressed="true">Rules</button><button type="button" data-traffic="global" aria-pressed="false">Global</button></div><div class="pv-mode-detail" data-traffic-note></div></div></div>
        <div class="pv-power-area"><button type="button" class="pv-power" data-power aria-label="Connect preview" aria-busy="false"><span class="pv-power-label">Connect</span></button><div class="pv-status" data-status role="status" aria-live="polite">Disconnected</div><div class="pv-status-reason" data-reason></div><div class="pv-active" data-active-label></div><button type="button" class="pv-button pv-primary" data-apply hidden>Apply & reconnect · จำลอง</button></div>
        <button type="button" class="pv-link-row" data-go="vpn">${icon('settings-2')}<span><span data-home-protocol></span> · VPN settings</span>${icon('chevron-right')}</button>
        <div class="pv-protection">${icon('shield-check')}<span>เป้าหมาย: รักษา traffic ที่เลือก Tunnel ระหว่าง recovery · แสดงข้อผิดพลาดพร้อม Logs</span></div><div class="pv-tiny" style="text-align:center" data-scope></div>
      </div>
      <div data-page="profiles" hidden>
        <div class="pv-page-head"><button type="button" class="pv-icon-button" data-go="home" aria-label="Back to Home"><span class="pv-back-glyph" aria-hidden="true">←</span></button><h2 class="pv-heading">Server profiles</h2><button type="button" class="pv-icon-button" data-add-profile aria-label="Add server profile"><span class="pv-back-glyph" aria-hidden="true">+</span></button></div>
        <p class="pv-small" style="margin:12px 0 0">เพิ่มหรือเปลี่ยน server ด้วย profile ได้ โดยไม่ต้องโหลด client ใหม่</p><div class="pv-tiny">ข้อมูลตัวอย่าง · ไม่ได้เชื่อมต่อหรือตรวจ latency</div>
        <section class="pv-card pv-margin-top" data-profile-editor hidden><div class="pv-row"><span data-profile-form-title>Add profile</span><button type="button" class="pv-icon-button" data-cancel-profile aria-label="Close profile editor"><span class="pv-back-glyph" aria-hidden="true">×</span></button></div><form class="pv-form" data-profile-form><label class="pv-field">Profile name<input name="name" aria-label="Profile name" maxlength="40" placeholder="Tokyo backup" required></label><label class="pv-field">Country<div class="pv-country-field"><span data-form-country></span><select name="country" aria-label="Profile country">${Object.entries(countries).map(([code,name])=>`<option value="${code}">${name} (${code})</option>`).join('')}</select></div></label><div class="pv-form-grid"><label class="pv-field">Server IP / hostname<input name="host" aria-label="Profile server address" placeholder="vpn.example.net" maxlength="253" autocomplete="off" required></label><label class="pv-field">Port<input name="port" aria-label="Profile port" type="number" min="1" max="65535" value="443" required></label></div><div class="pv-tiny">ต้นแบบนี้เก็บเฉพาะ metadata · ไม่ใส่ key, password หรือ profile จริง</div><div class="pv-error" data-profile-error role="alert"></div><div class="pv-row"><button type="button" class="pv-button" data-cancel-profile>Cancel</button><button type="submit" class="pv-button pv-primary">Save profile</button></div></form></section>
        <div class="pv-profile-list" data-profile-list></div><button type="button" class="pv-link-row pv-margin-top" data-add-profile>${icon('plus')}Add server profile</button>

      <div data-page="rules" hidden><h2 class="pv-heading">Routing rules</h2><div class="pv-small">แยก Apps / Websites / IP และ mode ของแต่ละหมวด</div><div data-rules-editor></div></div>
      <div data-page="vpn" hidden><div class="pv-stack"><div><h2 class="pv-heading">VPN settings</h2><div class="pv-small">Protocol และการเชื่อมต่อของ profile ที่เลือก</div></div><button type="button" class="pv-server" data-open-profiles><span data-vpn-server-flag></span><span class="pv-server-copy"><strong data-vpn-server-name></strong><span class="pv-tiny" data-vpn-server-host></span></span>${icon('chevron-right')}</button>
        <div class="pv-card"><label class="pv-field"><span class="pv-row"><span>VPN protocol</span><span data-wire></span></span><select data-protocol aria-label="VPN protocol"><option value="reality">VLESS + REALITY + Vision</option><option value="hy2">Hysteria 2</option><option value="auto">Auto · REALITY → Hysteria 2</option></select></label><div class="pv-small pv-margin-top" data-protocol-brief></div><details open><summary>ข้อจำกัดของ protocol</summary><div class="pv-facts" data-protocol-facts></div></details></div>
        <div class="pv-card"><label class="pv-field">Mesh coexistence<select data-mesh aria-label="Mesh policy"><option value="preserve">Preserve mesh routes · แนะนำ</option><option value="transport">Mesh transport ผ่าน VPN · วางแผน</option></select></label><div class="pv-small pv-margin-top" data-mesh-note></div><details><summary>ขอบเขตที่ยังต้องทดสอบ</summary><div class="pv-facts">Private mesh routes กับ encrypted outer traffic เป็นคนละส่วน Tailscale exit node / ZeroTier default route ต้องตรวจแยก และยังไม่รับรองว่าจะใช้ Global TUN ร่วมกันได้</div></details></div>

          if(s.profiles.some(p=>p.id!==s.editingProfileId&&p.name.toLowerCase()===name.toLowerCase()))throw Error('มีชื่อ profile นี้แล้ว');
          const existing=s.profiles.find(p=>p.id===s.editingProfileId);if(!existing&&s.profiles.length>=12)throw Error('ต้นแบบรองรับ 12 profiles ต่อ session');
          const profile={id:existing?.id||'profile-'+Date.now().toString(36)+'-'+s.nextId++,name,country,host,port,protocol:existing?.protocol||'reality'};
          if(existing)s.profiles=s.profiles.map(p=>p.id===existing.id?profile:p);else s.profiles.push(profile);
          if(!s.selectedProfileId){s.selectedProfileId=profile.id;s.protocol=profile.protocol;}s.formOpen=false;s.editingProfileId=null;error.textContent='';edit(existing?'profile.update':'profile.create',name+' · '+country);
        }catch(e){error.textContent=e.message;log('profile.validation_failed',e.message);}return;
      }
      if(form.hasAttribute('data-rule-form')){
        const kind=form.dataset.ruleForm,error=form.querySelector('[data-rule-error]');try{const target=normalize(kind,form.elements.target.value);if(s.rules.filter(r=>r.kind===kind).length>=12)throw Error('ต้นแบบรองรับ 12 รายการต่อหมวด');if(s.rules.some(r=>r.kind===kind&&r.target.toLowerCase()===target.toLowerCase()))throw Error('มีรายการนี้ในหมวดแล้ว');s.rules.push({id:'rule-'+Date.now().toString(36)+'-'+s.nextId++,kind,target});form.elements.target.value='';error.textContent='';edit('rule.add',categories[kind].title+' · '+target);}catch(e){error.textContent=e.message;log('rule.validation_failed',e.message);}return;
      }
      if(form.hasAttribute('data-inspect-form')){
        const verdict=form.parentElement.querySelector('[data-verdict]');try{const result=decide(form.elements.destination.value,form.elements.application.value),labels={tunnel:s.status==='connected'?'TUNNEL · จำลอง':'BLOCKED · ต้องมี tunnel',direct:'DIRECT / BYPASS',block:'BLOCK',mesh:'MESH ROUTE'};verdict.textContent=labels[result.action]+' — '+result.reason+(s.capture==='proxy'?' · เฉพาะ traffic ใน Proxy':'');log('route.preview',result.action+' · '+result.reason);}catch(e){verdict.textContent=e.message;log('route.preview_failed',e.message);}
      }
    }
    app.addEventListener('click',event=>{
      const profileChoice=event.target.closest('[data-select-profile]');if(profileChoice){event.preventDefault();selectProfile(profileChoice.dataset.selectProfile);return;}
      const button=event.target.closest('button');if(!button||button.disabled)return;
      if(button.dataset.capture){s.capture=button.dataset.capture;edit('policy.capture',s.capture);}
      else if(button.dataset.traffic){s.traffic=button.dataset.traffic;edit('policy.traffic',s.traffic);}
      else if(button.hasAttribute('data-power')){if(['stopped','blocked'].includes(s.status))connect();else{log('backend.disconnect.request','ยกเลิก attempt ที่ยังค้าง');disconnect();}}
      else if(button.hasAttribute('data-apply')){log('backend.config.apply','ใช้ draft profile/settings และ reconnect แบบจำลอง');connect();}
      else if(button.hasAttribute('data-sim'))simulate();
      else if(button.hasAttribute('data-open-profiles'))navigate('profiles');
      else if(button.hasAttribute('data-add-profile')){if(s.page!=='profiles')s.page='profiles';openProfileForm();}
      else if(button.dataset.editProfile){const profile=s.profiles.find(p=>p.id===button.dataset.editProfile);if(profile)openProfileForm(profile);}
      else if(button.hasAttribute('data-cancel-profile')){s.formOpen=false;s.editingProfileId=null;log('profile.form_cancel','ปิดฟอร์มโดยไม่แก้ profile');render();}
      else if(button.dataset.deleteProfile){s.pendingDelete=button.dataset.deleteProfile;log('profile.delete_requested','แสดงขั้นยืนยันลบ profile');renderProfiles();}
      else if(button.hasAttribute('data-cancel-delete')){s.pendingDelete=null;log('profile.delete_cancelled','คง profile เดิมไว้');renderProfiles();}
      else if(button.dataset.confirmDelete)deleteProfile(button.dataset.confirmDelete);
      else if(button.dataset.removeRule){s.rules=s.rules.filter(r=>r.id!==button.dataset.removeRule);edit('rule.remove','นำรายการออกจากหมวด');}
      else if(button.dataset.nav||button.dataset.go)navigate(button.dataset.nav||button.dataset.go);
      else if(button.type==='submit'&&button.form){event.preventDefault();handleForm(button.form);}
      else if(button.hasAttribute('data-export')){log('diagnostics.export','เตรียม JSON เหตุการณ์จำลองสำหรับคัดลอก');q('[data-export-output]').value=JSON.stringify({schema:2,simulation:true,events:s.events},null,2);q('[data-export-panel]').hidden=false;}
      else if(button.hasAttribute('data-close-export')){q('[data-export-panel]').hidden=true;log('diagnostics.close_export','ปิด JSON export preview');}
      else if(button.hasAttribute('data-clear-logs'))clearLogs();
    });
    app.addEventListener('change',event=>{
      const el=event.target;if(el.matches('[data-protocol]')){s.protocol=el.value;const profile=selectedProfile();if(profile)profile.protocol=s.protocol;edit('profile.protocol',s.protocol);}
      else if(el.matches('[data-mesh]')){s.mesh=el.value;edit('policy.mesh',s.mesh);}
      else if(el.hasAttribute('data-rule-mode')){s.ruleModes[el.dataset.ruleMode]=el.value;edit('rule.category_mode',categories[el.dataset.ruleMode].title+' → '+el.value);}
      else if(el.name==='country'&&el.closest('[data-profile-form]'))q('[data-form-country]').innerHTML=flag(el.value,true);
      else if(el.type==='radio'&&el.name===id+'-server')selectProfile(el.value);
    });
    app.addEventListener('submit',event=>{event.preventDefault();handleForm(event.target);});
    function restore(value){
      const model=value?.modelContent,stored=value?.privateContent;
      if(model){if(['proxy','tun'].includes(model.capture))s.capture=model.capture;if(['rules','global'].includes(model.traffic))s.traffic=model.traffic;if(['preserve','transport'].includes(model.mesh))s.mesh=model.mesh;if(model.ruleModes)for(const kind of Object.keys(categories))if(['tunnel','direct','block','off'].includes(model.ruleModes[kind]))s.ruleModes[kind]=model.ruleModes[kind];}
      if(stored?.schema===2&&Array.isArray(stored.profiles)){
        s.profiles=stored.profiles.slice(0,12).flatMap(p=>{try{if(!/^[a-z0-9_-]{1,70}$/i.test(p.id)||typeof p.name!=='string'||!p.name.trim()||p.name.length>40||!owns(countries,p.country)||!Number.isInteger(p.port)||p.port<1||p.port>65535)return [];return [{id:p.id,name:p.name,country:p.country,host:endpoint(p.host),port:p.port,protocol:owns(protocolInfo,p.protocol)?p.protocol:'reality'}];}catch{return [];}});
        s.profiles=s.profiles.filter((p,i,a)=>a.findIndex(other=>other.id===p.id)===i);s.selectedProfileId=s.profiles.some(p=>p.id===stored.selectedProfileId)?stored.selectedProfileId:s.profiles[0]?.id||null;
        if(Array.isArray(stored.rules)){s.rules=stored.rules.slice(0,36).flatMap((r,i)=>{try{if(!owns(categories,r.kind))return [];return [{id:'restored-'+i,kind:r.kind,target:normalize(r.kind,r.target)}];}catch{return [];}});}
      }s.protocol=selectedProfile()?.protocol||(owns(protocolInfo,model?.protocol)?model.protocol:'reality');
    }
    restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);render();});
    log('preview.ready','เริ่ม UI; ไม่มี service, socket, route, DNS, proxy หรือ firewall ถูกเปลี่ยน');render();
    app.querySelectorAll('button,summary').forEach(el=>el.classList.add('cursor-interaction'));
    if(globalThis.Tweak){const settings={radius:22,density:'comfortable'};const tweak=new Tweak({container:app,onChange:()=>{app.style.borderRadius=settings.radius+'px';app.style.setProperty('--pv-gap',settings.density==='compact'?'11px':'16px');}});tweak.addSlider(settings,'radius',{label:'Window corners',min:8,max:28,unit:'px'});tweak.addSelect(settings,'density',{label:'Spacing',options:['comfortable','compact']});}
  }
  root.querySelectorAll('.pv-stage').forEach(makeApp);if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();
</script>
